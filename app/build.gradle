apply plugin: 'com.android.application'

android {
    compileSdk {
        version = release(37) {
            // this block and its properties are optional
            minorApiLevel = 0
            //sdkExtension = 18
        }
        //version = preview("CinnamonBun")
    }
    defaultConfig {
        applicationId = "com.github.edeso.sa2ration"
        namespace = 'com.xda.sa2ration'
        minSdk = 21
        targetSdk = 37
        versionCode = 1
        versionName = "1.0.0"
        base.archivesName = "Sa2ration_2026-${versionName}"
        testInstrumentationRunner = "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-DEBUG'
        }
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        targetCompatibility = 1.11
        sourceCompatibility = 1.11
    }
    viewBinding {
        enabled = true
    }
}

dependencies {
    //implementation fileTree(dir: 'libs', include: ['*.jar'])
    // appcompat v1.7+ API21
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'net.sourceforge.streamsupport:streamsupport:1.7.4'
    // material v1.14+ API23
    //noinspection GradleDependency,NewerVersionAvailable
    implementation 'com.google.android.material:material:1.13.0'

    // workaround fix 'Duplicate class kotlin.collections.jdk8.CollectionsJDK8Kt found in modules ...'
    //implementation(platform("org.jetbrains.kotlin:kotlin-bom:2.0.0"))
}
